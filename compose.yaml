services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: trivozhno_test
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d trivozhno_test"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
